<!DOCTYPE html>
<html>
<head>
    <title>Check Order Images</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .order { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        .item { background: #f5f5f5; padding: 10px; margin: 5px 0; }
        .image-check { color: green; }
        .no-image { color: red; }
        img { max-width: 100px; height: auto; }
    </style>
</head>
<body>
    <h1>Order Images Check</h1>
    <div id="results"></div>

    <script>
        async function checkOrders() {
            try {
                const response = await fetch('http://localhost:8080/api/orders', {
                    credentials: 'include'
                });

                if (!response.ok) {
                    document.getElementById('results').innerHTML = `
                        <p style="color: red;">Failed to fetch orders: ${response.status} ${response.statusText}</p>
                        <p>Please make sure you're logged in at http://localhost:3000</p>
                    `;
                    return;
                }

                const orders = await response.json();
                let html = `<h2>Found ${orders.length} orders</h2>`;

                orders.forEach(order => {
                    html += `<div class="order">`;
                    html += `<h3>Order ID: ${order.orderId || order.id}</h3>`;
                    html += `<p>Status: ${order.status}</p>`;
                    html += `<p>Items: ${order.items ? order.items.length : 0}</p>`;

                    if (order.items && order.items.length > 0) {
                        order.items.forEach((item, idx) => {
                            html += `<div class="item">`;
                            html += `<strong>Item ${idx + 1}: ${item.productName || item.name}</strong><br>`;
                            html += `Product ID: ${item.productId}<br>`;

                            if (item.imageUrl) {
                                html += `<span class="image-check">✓ Image URL: ${item.imageUrl}</span><br>`;
                                const fullUrl = item.imageUrl.startsWith('/api/')
                                    ? `http://localhost:8080${item.imageUrl}`
                                    : item.imageUrl;
                                html += `<img src="${fullUrl}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />`;
                                html += `<span style="display:none; color:orange;">Image failed to load</span>`;
                            } else {
                                html += `<span class="no-image">✗ No image URL</span>`;
                            }

                            html += `</div>`;
                        });
                    }

                    html += `</div>`;
                });

                document.getElementById('results').innerHTML = html;

            } catch (error) {
                document.getElementById('results').innerHTML = `
                    <p style="color: red;">Error: ${error.message}</p>
                `;
            }
        }

        checkOrders();
    </script>
</body>
</html>
