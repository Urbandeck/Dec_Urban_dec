<!DOCTYPE html>
<html>
<head>
    <title>Check Stored Addresses</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .address { border: 1px solid #ccc; padding: 10px; margin: 10px 0; background: #f9f9f9; }
        .default { background: #e7f5e7; border-color: #4caf50; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
        button { padding: 5px 10px; margin: 5px; cursor: pointer; }
        .user-section { margin: 20px 0; padding: 20px; border: 2px solid #333; }
    </style>
</head>
<body>
    <h1>Check Stored Addresses in LocalStorage</h1>
    <div id="results"></div>

    <script>
        function checkAddresses() {
            const resultsDiv = document.getElementById('results');
            let html = '<h2>All Address Data in LocalStorage:</h2>';

            // Get all keys from localStorage
            const keys = Object.keys(localStorage);

            // Filter for address keys
            const addressKeys = keys.filter(key => key.includes('addresses_') || key.includes('address'));

            if (addressKeys.length === 0) {
                html += '<p style="color: red;">No address data found in localStorage</p>';
            } else {
                html += `<p>Found ${addressKeys.length} address-related keys:</p>`;

                addressKeys.forEach(key => {
                    html += `<div class="user-section">`;
                    html += `<h3>Key: ${key}</h3>`;

                    try {
                        const data = localStorage.getItem(key);
                        const parsed = JSON.parse(data);

                        html += `<p>Type: ${Array.isArray(parsed) ? 'Array' : typeof parsed}</p>`;

                        if (Array.isArray(parsed)) {
                            html += `<p>Number of addresses: ${parsed.length}</p>`;

                            parsed.forEach((addr, idx) => {
                                html += `<div class="address ${addr.isDefault ? 'default' : ''}">`;
                                html += `<strong>Address ${idx + 1} ${addr.isDefault ? '(DEFAULT)' : ''}</strong><br>`;
                                html += `ID: ${addr.id}<br>`;
                                html += `Name: ${addr.fullName}<br>`;
                                html += `Email: ${addr.email}<br>`;
                                html += `Phone: ${addr.phone}<br>`;
                                html += `Address: ${addr.addressLine1 || addr.address}<br>`;
                                if (addr.addressLine2) html += `Address Line 2: ${addr.addressLine2}<br>`;
                                html += `City: ${addr.city}<br>`;
                                html += `State: ${addr.state}<br>`;
                                html += `Pincode: ${addr.pincode}<br>`;
                                html += `Created: ${addr.createdAt || 'Unknown'}<br>`;
                                html += `</div>`;
                            });
                        } else {
                            html += `<pre>${JSON.stringify(parsed, null, 2)}</pre>`;
                        }
                    } catch (e) {
                        html += `<p style="color: orange;">Raw value (not JSON): ${localStorage.getItem(key)}</p>`;
                    }

                    html += `</div>`;
                });
            }

            // Also check current user
            html += '<h2>Current User Check:</h2>';
            const authData = localStorage.getItem('auth-storage');
            if (authData) {
                try {
                    const auth = JSON.parse(authData);
                    if (auth.state && auth.state.user) {
                        html += `<p>Logged in as: ${auth.state.user.email}</p>`;
                        html += `<p>User name: ${auth.state.user.name}</p>`;

                        // Check if this user has addresses
                        const userAddressKey = `addresses_${auth.state.user.email}`;
                        const userAddresses = localStorage.getItem(userAddressKey);
                        if (userAddresses) {
                            html += `<p style="color: green;">✓ User has address data stored</p>`;
                        } else {
                            html += `<p style="color: red;">✗ No address data for this user</p>`;
                        }
                    }
                } catch (e) {
                    html += `<p>Could not parse auth data</p>`;
                }
            } else {
                html += `<p>No user logged in</p>`;
            }

            // Add utility buttons
            html += '<h2>Utility Functions:</h2>';
            html += '<button onclick="exportAddresses()">Export All Address Data</button>';
            html += '<button onclick="clearAddresses()">Clear All Addresses (Dangerous!)</button>';

            resultsDiv.innerHTML = html;
        }

        function exportAddresses() {
            const data = {};
            Object.keys(localStorage).forEach(key => {
                if (key.includes('address')) {
                    data[key] = localStorage.getItem(key);
                }
            });

            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'addresses_backup.json';
            a.click();
        }

        function clearAddresses() {
            if (confirm('Are you sure you want to clear all address data? This cannot be undone!')) {
                Object.keys(localStorage).forEach(key => {
                    if (key.includes('addresses_')) {
                        localStorage.removeItem(key);
                    }
                });
                alert('Address data cleared');
                checkAddresses();
            }
        }

        // Check on load
        checkAddresses();

        // Refresh every 2 seconds to see live changes
        setInterval(checkAddresses, 2000);
    </script>
</body>
</html>
