spring:
  application:
    name: digital-frames-shop

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digitalframes_shop}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:ajaypatil}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:urbandec.in@gmail.com}
    password: ${MAIL_PASSWORD:zjij kiuf yxfl gypd}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
      file-size-threshold: 2KB

  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 3600000 # 1 hour
      refresh-expiration: 604800000 # 7 days

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_key}
  key-secret: ${RAZORPAY_KEY_SECRET:rzp_test_secret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:webhook_secret}

server:
  port: 8080
  forward-headers-strategy: native  # Enable processing of X-Forwarded-* headers
  error:
    include-message: always
    include-binding-errors: always
  servlet:
    session:
      timeout: 24h # 24 hours session timeout
      cookie:
        name: SESSIONID
        http-only: true
        secure: true # HTTPS in production
        same-site: none # Required for cross-origin with credentials
        max-age: 2592000 # 30 days in seconds

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator

logging:
  level:
    com.digitalframes: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000,https://frontend-tawny-psi-67.vercel.app,https://www.urbandec.in,https://urbandec.in
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  email:
    enabled: ${MAIL_ENABLED:true}

video:
  upload:
    directory: ${VIDEO_UPLOAD_DIR:/var/www/videos/cta-videos}

shiprocket:
  email: ${SHIPROCKET_EMAIL:}
  password: ${SHIPROCKET_PASSWORD:}
  pickup-location: ${SHIPROCKET_PICKUP_LOCATION:Primary}
  channel-id: ${SHIPROCKET_CHANNEL_ID:}
  api:
    base-url: ${SHIPROCKET_API_URL:https://apiv2.shiprocket.in/v1/external}

twilio:
  account:
    sid: ${TWILIO_ACCOUNT_SID:}
  auth:
    token: ${TWILIO_AUTH_TOKEN:}
  phone:
    number: ${TWILIO_PHONE_NUMBER:}