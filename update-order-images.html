<!DOCTYPE html>
<html>
<head>
    <title>Update Order Images</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Update Order Images from Products</h1>
    <p>This will update all existing orders with product images from the database.</p>
    <p><strong>Note:</strong> You must be logged in as admin at <a href="http://localhost:3000/admin" target="_blank">http://localhost:3000/admin</a> first.</p>

    <button onclick="updateImages()">Update Order Images</button>

    <div id="result"></div>

    <script>
        async function updateImages() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Updating...</p>';

            try {
                const response = await fetch('http://localhost:8080/api/admin/orders/update-images', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include'
                });

                if (!response.ok) {
                    if (response.status === 403) {
                        resultDiv.innerHTML = `
                            <p class="error">Authentication required!</p>
                            <p>Please login as admin at <a href="http://localhost:3000/admin" target="_blank">http://localhost:3000/admin</a></p>
                            <p>Username: admin@digitalframes.com</p>
                            <p>Password: Admin@2024!</p>
                        `;
                        return;
                    }
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Success!</h3>
                            <p>${data.message}</p>
                            <ul>
                                <li>Total items processed: ${data.totalItems}</li>
                                <li>Items updated with images: ${data.updatedCount}</li>
                            </ul>
                            <p>Now refresh the <a href="http://localhost:3000/orders" target="_blank">My Orders page</a> to see the images!</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Error</h3>
                            <p>${data.error || 'Unknown error occurred'}</p>
                        </div>
                    `;
                }

            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
