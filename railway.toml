[build]
builder = "nixpacks"
buildCommand = "cd backend && chmod +x mvnw && ./mvnw clean package -DskipTests"

[deploy]
startCommand = "cd backend && java -Dserver.port=$PORT -jar target/digital-frames-shop-0.0.1-SNAPSHOT.jar"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
